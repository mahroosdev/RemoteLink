# -Djdk.net.unixdomain.tmpdir: AF_UNIX connect fails with WSAEINVAL for Java on this
# machine; an invalid dir forces the JDK's internal NIO pipe onto TCP loopback, which works.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=C:\\__force_tcp_pipe__
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
