<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none';" />
    <link rel="icon" type="image/svg+xml" href="/remotelink-app.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RemoteLink Pro</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0b0c0f;
      }

      .startup-intro-static {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0c0f;
        color: #f5f5f5;
        font-family: Inter, 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      .startup-static-panel {
        width: min(280px, calc(100vw - 48px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: startup-static-panel-in 0.42s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .startup-static-logo {
        width: 88px;
        height: 88px;
        display: block;
        filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.36));
      }

      .startup-static-logo svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .startup-static-brand {
        text-align: center;
      }

      .startup-static-brand h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .startup-static-brand p {
        margin: 6px 0 0;
        color: #858b96;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      .startup-static-progress {
        width: 168px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #2a2d34;
      }

      .startup-static-progress-fill {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #3b82f6;
        animation: startup-static-progress-slide 1.05s ease-in-out infinite;
      }

      @keyframes startup-static-panel-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes startup-static-progress-slide {
        0% { transform: translateX(-115%); }
        48% { transform: translateX(68%); }
        100% { transform: translateX(255%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-static-panel,
        .startup-static-progress-fill {
          animation: none;
        }

        .startup-static-progress-fill {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-intro-static" role="status" aria-label="RemoteLink starting">
        <div class="startup-static-panel">
          <div class="startup-static-logo" aria-hidden="true">
            <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="startup-tile" x1="10" y1="6" x2="98" y2="104" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#3b414b"/>
                  <stop offset="0.48" stop-color="#232831"/>
                  <stop offset="1" stop-color="#0f1318"/>
                </linearGradient>
                <radialGradient id="startup-glow" cx="25" cy="13" r="82" gradientUnits="userSpaceOnUse">
                  <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
                  <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.07"/>
                  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <rect x="6" y="5" width="96" height="98" rx="24" fill="url(#startup-tile)"/>
              <rect x="6" y="5" width="96" height="98" rx="24" fill="url(#startup-glow)"/>
              <rect x="6.5" y="5.5" width="95" height="97" rx="23.5" stroke="#ffffff" stroke-opacity="0.14"/>
              <path d="M43 34L25 54L43 74M65 34L83 54L65 74" stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="startup-static-brand">
            <h1>REMOTELINK</h1>
            <p>Pro Utility</p>
          </div>
          <div class="startup-static-progress" aria-hidden="true">
            <div class="startup-static-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
